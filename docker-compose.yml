services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ramnet-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BACKEND_PORT=8080
      - JWT_SECRET=ramnet_super_secret_jwt_key_2026_gold_blue
      - PAYSTACK_SECRET_KEY=sk_test_1234567890abcdef1234567890abcdef12345678
      - PAYSTACK_PUBLIC_KEY=pk_test_1234567890abcdef1234567890abcdef12345678
    volumes:
      - ramnet-db-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ramnet-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FRONTEND_PORT=3000
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: ramnet-admin
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ADMIN_PORT=3001
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ramnet-db-data:
